name: android-apk

# Gera o APK do WordCraft para Android (arm64). Rode em Actions > android-apk > Run workflow.

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: android-apk

      - name: Instalar cargo-apk
        run: cargo install cargo-apk --locked

      - name: Criar a chave de debug
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Compilar o APK
        run: cargo apk build --release -p wordcraft-android --lib

      - name: Guardar o APK
        uses: actions/upload-artifact@v4
        with:
          name: wordcraft-apk
          path: target/**/apk/*.apk
